<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2b29" />

    <title>ProspectBArk! | NYC Dog Daycare, Walking and Pet Sitting</title>
    <meta
      name="description"
      content="Dog daycare, dog walking, pet sitting and vacation care from ProspectBArk! NYC premium pet care since 2010 at 578 Fifth Avenue."
    />
    <link rel="canonical" href="https://prospectbark.com/" />

    <!-- The opening lockup, preloaded so it downloads alongside the JS bundle
         instead of waiting for React to mount and request it. -->
    <link rel="preload" as="image" href="./brand/logo-mark.webp" fetchpriority="high" />

    <!-- Favicons. The old inline SVG icon is gone on purpose: browsers prefer
         an SVG icon over any PNG, so leaving it would have kept overriding
         these. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="./favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph. {{TOKENS}} are filled at build time by scripts/site-meta.js
         from src/data (the rating comes from SITE.rating). Crawlers need
         absolute URLs, so images and og:url use the deployed address. -->
    <meta property="og:type" content="business.business" />
    <meta property="og:site_name" content="ProspectBArk!" />
    <meta property="og:title" content="{{SHARE_TITLE}}" />
    <meta property="og:description" content="{{SHARE_DESCRIPTION}}" />
    <meta property="og:image" content="{{SITE_URL}}og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A husky looking up at the camera on an autumn path" />
    <meta property="og:url" content="{{SITE_URL}}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SHARE_TITLE}}" />
    <meta name="twitter:description" content="{{SHARE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local business structured data, generated from src/data/site.js -->
    <script type="application/ld+json">
{{STRUCTURED_DATA}}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
